
name: Laravel 13 CI/CD - InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, curl, fileinfo, openssl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies for testing
        run: composer install --prefer-dist --no-interaction

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Laravel tests
        run: |
          rm -f bootstrap/cache/config.php

          export APP_ENV=testing
          export APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          export CACHE_STORE=array
          export SESSION_DRIVER=array
          export DB_CONNECTION=sqlite
          export DB_DATABASE=:memory:

          php artisan test

      - name: Build frontend assets
        run: npm run build

      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --no-scripts

          composer dump-autoload --no-dev

      - name: Prepare and validate FTP packages
        run: |
          python3 .github/scripts/package-deploy.py
          php -l deploy/public/index.php

      - name: Deploy private Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy/app/
          server-dir: /htdocs/laravel_app/
          # Start a new sync history for the split deployment packages.
          state-name: .ftp-deploy-laravel-app-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/auth.json
            **/*.sqlite
            **/*.sqlite-*
            **/*.sqlite3
            **/*.sqlite3-*
            **/*.key
            storage/app/private/**/*
            storage/app/public/**/*
            storage/framework/cache/data/**/*
            storage/framework/sessions/**/*
            storage/framework/views/**/*
            storage/framework/down
            storage/framework/maintenance.php
            storage/logs/**/*

      - name: Deploy public web files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy/public/
          server-dir: /htdocs/
          state-name: .ftp-deploy-public-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/auth.json
            **/*.sqlite
            **/*.sqlite-*
            **/*.sqlite3
            **/*.sqlite3-*
            **/*.key
            laravel_app/
            laravel_app/**
            storage/
            storage/**
