
name: Laravel 13 CI/CD - InfinityFree

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'infinityfree-production' || format('siabsen-validation-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, curl, fileinfo, openssl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies for testing
        run: composer install --prefer-dist --no-interaction

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Laravel tests
        run: |
          rm -f bootstrap/cache/config.php

          export APP_ENV=testing
          export APP_KEY='base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          export CACHE_STORE=array
          export SESSION_DRIVER=array
          export DB_CONNECTION=sqlite
          export DB_DATABASE=:memory:

          php artisan test

      - name: Build frontend assets
        run: npm run build

      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --no-scripts

          composer dump-autoload --no-dev

      - name: Prepare and validate deployment packages
        run: |
          python3 -B .github/scripts/package-deploy.py
          php -l deploy/public/index.php

      - name: Test deployment file protection
        run: python3 -B -m unittest discover -s .github/scripts -v

      - name: Archive validated packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf "$RUNNER_TEMP/deploy.tar.gz" deploy .github/scripts/deploy_ftp.py

      - name: Upload validated packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: infinityfree-deploy
          path: ${{ runner.temp }}/deploy.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          name: infinityfree-deploy
          path: ${{ runner.temp }}/infinityfree-deploy

      - name: Extract validated packages
        run: tar -xzf "$RUNNER_TEMP/infinityfree-deploy/deploy.tar.gz"

      - name: Upload application and public files over explicit FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 -B .github/scripts/deploy_ftp.py --resume
